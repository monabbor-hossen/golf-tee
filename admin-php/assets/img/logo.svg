<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2312"/>
      <stop offset="50%" stop-color="#144322"/>
      <stop offset="100%" stop-color="#1e5631"/>
    </linearGradient>

    <!-- Golden Tee Metallic Gradient -->
    <linearGradient id="teeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe699"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Ball 3D Shading -->
    <radialGradient id="ballShine" cx="32%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f1f5f9"/>
      <stop offset="90%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>

    <!-- Dynamic Swing Arc -->
    <linearGradient id="swingArc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#4ade80" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle Emblem Background -->
  <rect width="64" height="64" rx="16" fill="url(#logoBg)"/>
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="rgba(251,191,36,0.2)" stroke-width="0.75"/>

  <!-- Fairway Green Base Arc -->
  <ellipse cx="32" cy="55" rx="20" ry="6" fill="#0d2e18" opacity="0.8"/>

  <!-- Dynamic Swing Flight Arc -->
  <path d="M 12 40 C 14 18, 50 16, 52 34" stroke="url(#swingArc)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.85"/>
  <circle cx="51.5" cy="33.5" r="1.5" fill="#fbbf24"/>

  <!-- Golf Tee -->
  <g filter="url(#logoShadow)">
    <!-- Tee shaft and base -->
    <path d="M 23 37 Q 32 40 41 37 L 35 44 L 34 52 Q 34 54.5 32 55.5 Q 30 54.5 30 52 L 29 44 Z" fill="url(#teeGold)"/>
    <!-- Tee cup rim -->
    <ellipse cx="32" cy="37" rx="9" ry="2.2" fill="#fef08a"/>
    <ellipse cx="32" cy="37" rx="7" ry="1.4" fill="#d97706" opacity="0.6"/>
  </g>

  <!-- Golf Ball sitting on the tee -->
  <g filter="url(#logoShadow)">
    <circle cx="32" cy="23" r="13.5" fill="url(#ballShine)"/>

    <!-- Realistic Dimples Pattern -->
    <circle cx="27" cy="18" r="1.2" fill="#64748b" opacity="0.35"/>
    <circle cx="32" cy="16" r="1.2" fill="#64748b" opacity="0.35"/>
    <circle cx="37" cy="19" r="1.2" fill="#64748b" opacity="0.35"/>
    <circle cx="31" cy="22" r="1.3" fill="#64748b" opacity="0.35"/>
    <circle cx="26" cy="23" r="1.2" fill="#64748b" opacity="0.35"/>
    <circle cx="36" cy="24" r="1.2" fill="#64748b" opacity="0.35"/>
    <circle cx="30" cy="27" r="1.2" fill="#64748b" opacity="0.35"/>
    <circle cx="25" cy="28" r="1.0" fill="#64748b" opacity="0.25"/>
    <circle cx="37" cy="28" r="1.0" fill="#64748b" opacity="0.25"/>
    <circle cx="33" cy="31" r="1.0" fill="#64748b" opacity="0.25"/>

    <!-- Specular Light Glint -->
    <circle cx="27" cy="16.5" r="2.2" fill="#ffffff" opacity="0.9"/>
    <circle cx="28.5" cy="15" r="1" fill="#ffffff" opacity="0.7"/>
  </g>
</svg>
